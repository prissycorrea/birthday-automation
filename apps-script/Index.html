<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f5fb; --card: #fff; --text: #1f1d2b; --muted: #6b6880; --line: #e6e3f0;
    --accent: #7c4dff; --accent-soft: #efe9ff; --ok: #1e9e5a; --warn: #c77700; --err: #d23b3b;
    --today: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14131b; --card: #1d1b27; --text: #ecebf3; --muted: #a3a0b6; --line: #2e2b3c;
            --accent: #a98bff; --accent-soft: #2a2440; --today: #3a3220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  header h1 { font-size: 22px; margin: 0; flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { border-color: transparent; background: transparent; padding: 6px 8px; }
  button:disabled { opacity: .55; cursor: wait; }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }
  .row.wrap > * { min-width: 160px; }
  .upcoming { display: grid; gap: 8px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); }
  .item.today { background: var(--today); }
  .item.off { opacity: .5; }
  .date { width: 52px; text-align: center; flex: none; }
  .date b { display: block; font-size: 20px; line-height: 1; }
  .date small { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .meta { color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .badge.err { background: #fde8e8; color: var(--err); }
  .actions { display: flex; gap: 2px; }
  .trigger { display: grid; gap: 10px; }
  .runs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .runs a { color: inherit; text-decoration: none; display: flex; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 8px; }
  .runs a:hover { background: var(--accent-soft); }
  .runs .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .runs time { color: var(--muted); font-size: 13px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  .check input { width: auto; }
  dialog { border: none; border-radius: 16px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { padding: 20px; display: grid; gap: 12px; }
  dialog h3 { margin: 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 10px 16px; border-radius: 10px; max-width: calc(100vw - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--err); color: #fff; }
  .skeleton { height: 54px; border-radius: 12px; background: var(--line); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎂 Aniversários</h1>
    <button class="primary" id="btnNovo">+ Adicionar</button>
  </header>

  <section class="card">
    <h2>Próximos 30 dias</h2>
    <div class="upcoming" id="proximos"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="card">
    <h2>Disparar automação</h2>
    <div class="trigger" id="triggerBox">
      <div class="row wrap">
        <div>
          <label for="modo">O que enviar</label>
          <select id="modo">
            <option value="lembretes">Lembretes de hoje/amanhã</option>
            <option value="resumo">Resumo dos próximos 30 dias</option>
            <option value="teste">Mensagem de teste</option>
          </select>
        </div>
        <div>
          <label for="dataRef">Simular data (opcional)</label>
          <input type="date" id="dataRef">
        </div>
      </div>
      <label class="check"><input type="checkbox" id="dryRun"> Só simular (mostra no log do GitHub, não envia)</label>
      <div class="row" style="align-items:center">
        <button class="primary" id="btnDisparar" style="flex:none">▶ Disparar agora</button>
        <span class="muted" id="ghInfo" style="font-size:13px"></span>
      </div>
      <div>
        <div class="row" style="align-items:center;margin-top:6px">
          <strong style="flex:1;font-size:14px">Últimas execuções</strong>
          <button class="ghost" id="btnRuns" title="Atualizar">↻</button>
        </div>
        <ul class="runs" id="runs"></ul>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row" style="align-items:center;margin-bottom:12px">
      <h2 style="margin:0">Todos</h2>
      <input id="busca" placeholder="Buscar…" style="max-width:220px">
    </div>
    <div class="upcoming" id="todos"></div>
    <p class="muted" style="font-size:13px;margin:12px 0 0">
      Os dados ficam na <a id="linkPlanilha" target="_blank" style="color:var(--accent)">planilha</a>.
      <span id="usuario"></span>
    </p>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitulo">Novo aniversário</h3>
    <div><label for="fNome">Nome</label><input id="fNome" required maxlength="80" autocomplete="off"></div>
    <div class="row">
      <div><label for="fDia">Dia</label><input id="fDia" type="number" min="1" max="31" required inputmode="numeric"></div>
      <div style="flex:1.7"><label for="fMes">Mês</label>
        <select id="fMes" required></select></div>
      <div><label for="fAno">Ano (opcional)</label><input id="fAno" type="number" min="1900" inputmode="numeric" placeholder="—"></div>
    </div>
    <div><label for="fObs">Observação (opcional)</label><input id="fObs" maxlength="120" placeholder="ex.: prima, colega do trabalho"></div>
    <label class="check"><input type="checkbox" id="fAtivo" checked> Receber lembretes</label>
    <div class="row" style="justify-content:space-between;align-items:center">
      <button type="button" class="ghost" id="btnExcluir" style="color:var(--err);flex:none">Excluir</button>
      <div class="row" style="flex:none;gap:8px">
        <button type="button" id="btnCancelar">Cancelar</button>
        <button type="submit" class="primary" id="btnSalvar">Salvar</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
  const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const MESES_LONGOS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const $ = (id) => document.getElementById(id);
  let estado = { aniversarios: [] };
  let editando = null;

  const api = (fn, ...args) => new Promise((ok, erro) =>
    google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn](...args));

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg, erro) {
    const t = $('toast');
    t.textContent = msg; t.className = 'toast show' + (erro ? ' err' : '');
    clearTimeout(toast.h); toast.h = setTimeout(() => (t.className = 'toast'), erro ? 6000 : 3500);
  }
  const msgErro = (e) => (e && e.message ? e.message.replace(/^Exception: /, '') : String(e));

  function quando(a) {
    if (!a.valido) return '<span class="badge err">data inválida</span>';
    if (a.diasAte === 0) return '<span class="badge">🎉 hoje</span>';
    if (a.diasAte === 1) return '<span class="badge">amanhã</span>';
    return `<span class="badge">em ${a.diasAte} dias</span>`;
  }

  function itemHtml(a) {
    const meta = [];
    if (a.valido && a.idade) meta.push(`faz ${a.idade} anos`);
    if (a.obs) meta.push(esc(a.obs));
    if (!a.ativo) meta.push('lembretes desligados');
    if (!a.valido) meta.push(`“${esc(a.dataTexto)}”`);
    const data = a.valido
      ? `<b>${String(a.dia).padStart(2,'0')}</b><small>${MESES[a.mes-1]}</small>`
      : '<b>?</b>';
    return `<div class="item ${a.diasAte === 0 ? 'today' : ''} ${a.ativo ? '' : 'off'}">
      <div class="date">${data}</div>
      <div class="who"><div class="name">${esc(a.nome)}</div><div class="meta">${meta.join(' · ') || '&nbsp;'}</div></div>
      ${quando(a)}
      <div class="actions"><button class="ghost" data-edit="${a.linha}" title="Editar" aria-label="Editar ${esc(a.nome)}">✏️</button></div>
    </div>`;
  }

  function render() {
    const lista = estado.aniversarios;
    const prox = lista.filter((a) => a.valido && a.ativo && a.diasAte <= 30).sort((x, y) => x.diasAte - y.diasAte);
    $('proximos').innerHTML = prox.length ? prox.map(itemHtml).join('') : '<div class="empty">Nenhum aniversário nos próximos 30 dias.</div>';

    const q = $('busca').value.trim().toLowerCase();
    const todos = lista
      .filter((a) => !q || a.nome.toLowerCase().includes(q) || a.obs.toLowerCase().includes(q))
      .sort((x, y) => (x.valido - y.valido) || ((x.mes - y.mes) || (x.dia - y.dia)) || x.nome.localeCompare(y.nome));
    $('todos').innerHTML = todos.length ? todos.map(itemHtml).join('')
      : `<div class="empty">${q ? 'Nada encontrado.' : 'Nenhum aniversário cadastrado ainda. Clique em “+ Adicionar”.'}</div>`;
  }

  async function carregar() {
    try {
      estado = await api('getDados');
      $('linkPlanilha').href = estado.planilhaUrl;
      $('usuario').textContent = estado.usuario ? `Conectado como ${estado.usuario}.` : '';
      $('ghInfo').textContent = estado.github.configurado ? estado.github.repo : '⚠️ GITHUB_TOKEN não configurado';
      $('btnDisparar').disabled = !estado.github.configurado;
      render();
      if (estado.github.configurado) carregarRuns();
    } catch (e) {
      $('proximos').innerHTML = `<div class="empty">Erro ao carregar: ${esc(msgErro(e))}</div>`;
    }
  }

  const ICONES = { success: '✅', failure: '❌', cancelled: '⏹️', skipped: '⏭️' };
  async function carregarRuns() {
    try {
      const runs = await api('getExecucoes');
      $('runs').innerHTML = runs.length ? runs.map((r) => {
        const icone = r.status !== 'completed' ? '⏳' : (ICONES[r.conclusao] || '⚪');
        const dt = new Date(r.criado).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        return `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">
          <span>${icone}</span><span class="t">${esc(r.titulo)}</span><time>${dt}</time></a></li>`;
      }).join('') : '<li class="muted">Nenhuma execução ainda.</li>';
      // se tiver algo rodando, atualiza sozinho
      clearTimeout(carregarRuns.h);
      if (runs.some((r) => r.status !== 'completed')) carregarRuns.h = setTimeout(carregarRuns, 8000);
    } catch (e) {
      $('runs').innerHTML = `<li class="muted">${esc(msgErro(e))}</li>`;
    }
  }

  async function disparar() {
    const btn = $('btnDisparar');
    btn.disabled = true;
    try {
      const r = await api('dispararWorkflow', { modo: $('modo').value, dryRun: $('dryRun').checked, data: $('dataRef').value });
      toast(r.mensagem, !r.ok);
      if (r.ok) setTimeout(carregarRuns, 3000);
    } catch (e) { toast(msgErro(e), true); }
    finally { btn.disabled = false; }
  }

  function abrir(a) {
    editando = a || null;
    $('dlgTitulo').textContent = a ? 'Editar aniversário' : 'Novo aniversário';
    $('fNome').value = a ? a.nome : '';
    $('fDia').value = a && a.valido ? a.dia : '';
    $('fMes').value = a && a.valido ? a.mes : '';
    $('fAno').value = a && a.ano ? a.ano : '';
    $('fAno').max = new Date().getFullYear();
    $('fObs').value = a ? a.obs : '';
    $('fAtivo').checked = a ? a.ativo : true;
    $('btnExcluir').style.visibility = a ? 'visible' : 'hidden';
    $('dlg').showModal();
    $('fNome').focus();
  }

  async function salvar(ev) {
    ev.preventDefault();
    const btn = $('btnSalvar'); btn.disabled = true;
    try {
      estado = await api('salvarAniversario', {
        linha: editando ? editando.linha : null,
        nomeOriginal: editando ? editando.nome : null,
        nome: $('fNome').value, dia: $('fDia').value, mes: $('fMes').value,
        ano: $('fAno').value, obs: $('fObs').value, ativo: $('fAtivo').checked,
      });
      $('dlg').close(); render(); toast('Salvo na planilha ✓');
    } catch (e) { toast(msgErro(e), true); }
    finally { btn.disabled = false; }
  }

  async function excluir() {
    if (!editando || !confirm(`Excluir ${editando.nome}?`)) return;
    try {
      estado = await api('excluirAniversario', editando.linha, editando.nome);
      $('dlg').close(); render(); toast('Excluído');
    } catch (e) { toast(msgErro(e), true); }
  }

  // ------- init
  $('fMes').innerHTML = '<option value="">—</option>' + MESES_LONGOS.map((m, i) => `<option value="${i+1}">${m}</option>`).join('');
  $('btnNovo').onclick = () => abrir();
  $('btnCancelar').onclick = () => $('dlg').close();
  $('btnExcluir').onclick = excluir;
  $('form').onsubmit = salvar;
  $('btnDisparar').onclick = disparar;
  $('btnRuns').onclick = carregarRuns;
  $('busca').oninput = render;
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-edit]');
    if (b) abrir(estado.aniversarios.find((a) => a.linha === Number(b.dataset.edit)));
  });
  carregar();
</script>
</body>
</html>
